on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: warp-ubuntu-latest-x64-4x
    name: Build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
      - run: pnpm nx affected --targets=build --base=origin/main --head=HEAD
  test:
    runs-on: warp-ubuntu-latest-x64-4x
    name: Unit tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
      - run: pnpm nx affected --targets=test --base=origin/main --head=HEAD --passWithNoTests --watch=false
  static-analysis:
    runs-on: warp-ubuntu-latest-x64-4x
    name: Static Analyzis
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
      - run: pnpm nx affected --targets=lint --base=origin/main --head=HEAD
      - run: pnpm nx sync:check
      - run: pnpm nx affected --targets=typecheck --base=origin/main --head=HEAD
      - run: NX_BASE=origin/main NX_HEAD=HEAD pnpm nx format:check
      - run: pnpm audit --ignore-registry-errors --prod --audit-level high
      - name: Check dependency licenses
        run: pnpm run check-licenses
  e2e:
    runs-on: warp-ubuntu-latest-x64-4x
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write
    name: E2E tests
    env:
      VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
      - run: |
          git config --global --add safe.directory '*'
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: E2E
        run: pnpm nx affected --targets=e2e --base=origin/main --head=HEAD
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: dist/.playwright/
          retention-days: 3
